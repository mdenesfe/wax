// Noise certificate chain sent (encrypted) in the ServerHello payload
// (WhatsApp Web module "WACert"). Field numbers MUST match WhatsApp Web.
syntax = "proto2";
package wax.wacert;
option go_package = "github.com/mdenesfe/wax/internal/proto/wacert";

message CertChain {
	message NoiseCertificate {
		message Details {
			optional uint32 serial = 1;
			optional uint32 issuerSerial = 2;
			optional bytes key = 3;
			optional uint64 notBefore = 4;
			optional uint64 notAfter = 5;
		}

		// Serialized Details. Signatures are computed over these exact bytes,
		// so they are kept raw and decoded separately.
		optional bytes details = 1;
		optional bytes signature = 2;
	}

	optional NoiseCertificate leaf = 1;
	optional NoiseCertificate intermediate = 2;
}
