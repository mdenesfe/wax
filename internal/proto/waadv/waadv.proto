// Account/device identity attestation ("ADV") messages exchanged during
// pairing (WhatsApp Web module "WAAdv"). Field numbers MUST match WhatsApp Web.
syntax = "proto2";
package wax.waadv;
option go_package = "github.com/mdenesfe/wax/internal/proto/waadv";

enum ADVEncryptionType {
	E2EE = 0;
	HOSTED = 1;
}

// Details of a companion device, signed by the primary device's account key.
message ADVDeviceIdentity {
	optional uint32 rawID = 1;
	optional uint64 timestamp = 2;
	optional uint32 keyIndex = 3;
	optional ADVEncryptionType accountType = 4;
	optional ADVEncryptionType deviceType = 5;
}

// details = serialized ADVDeviceIdentity. The account signature is made by
// the phone; the device signature is added by us when confirming pairing.
message ADVSignedDeviceIdentity {
	optional bytes details = 1;
	optional bytes accountSignatureKey = 2;
	optional bytes accountSignature = 3;
	optional bytes deviceSignature = 4;
}

// details = serialized ADVSignedDeviceIdentity, authenticated with the
// adv secret we put in the QR code.
message ADVSignedDeviceIdentityHMAC {
	optional bytes details = 1;
	optional bytes HMAC = 2;
	optional ADVEncryptionType accountType = 3;
}

message ADVKeyIndexList {
	optional uint32 rawID = 1;
	optional uint64 timestamp = 2;
	optional uint32 currentIndex = 3;
	repeated uint32 validIndexes = 4 [packed=true];
	optional ADVEncryptionType accountType = 5;
}

message ADVSignedKeyIndexList {
	optional bytes details = 1;
	optional bytes accountSignature = 2;
	optional bytes accountSignatureKey = 3;
}
