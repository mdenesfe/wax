// Our own persistence format for Signal session state. This is NOT a
// WhatsApp protocol schema; it may evolve freely as long as old records stay
// readable (add fields, never renumber).
syntax = "proto3";
package wax.signalstore;
option go_package = "github.com/mdenesfe/wax/internal/proto/signalstore";

message ChainKey {
	uint32 index = 1;
	bytes  key   = 2;
}

message MessageKey {
	uint32 index     = 1;
	bytes  cipherKey = 2;
	bytes  macKey    = 3;
	bytes  iv        = 4;
}

message SenderChain {
	bytes    ratchetPublic  = 1;
	bytes    ratchetPrivate = 2;
	ChainKey chainKey       = 3;
}

message ReceiverChain {
	bytes               ratchetPublic = 1;
	ChainKey            chainKey      = 2;
	repeated MessageKey messageKeys   = 3; // skipped keys, oldest first
}

// Present while our first messages have not been answered: every outgoing
// message is wrapped in a PreKeySignalMessage until then.
message PendingPreKey {
	bool   hasPreKeyId    = 1;
	uint32 preKeyId       = 2;
	uint32 signedPreKeyId = 3;
	bytes  baseKey        = 4;
}

message SessionState {
	uint32                 version              = 1;
	bytes                  localIdentity        = 2;
	bytes                  remoteIdentity       = 3;
	bytes                  rootKey              = 4;
	uint32                 previousCounter      = 5;
	SenderChain            senderChain          = 6;
	repeated ReceiverChain receiverChains       = 7; // newest last
	PendingPreKey          pendingPreKey        = 8;
	uint32                 remoteRegistrationId = 9;
	uint32                 localRegistrationId  = 10;
	bytes                  aliceBaseKey         = 11;
}

message SessionRecord {
	SessionState          current  = 1;
	repeated SessionState previous = 2; // newest first
}
