// Handshake and client-identification messages (WhatsApp Web module
// "WAWebProtobufsWa6"). Only the fields this project uses are declared;
// unknown fields received from the server are preserved by protobuf-go and
// never cause a decode failure. Field numbers MUST match WhatsApp Web exactly.
syntax = "proto2";
package wax.wa6;
option go_package = "github.com/mdenesfe/wax/internal/proto/wa6";

message HandshakeMessage {
	message ClientHello {
		optional bytes ephemeral = 1;
		optional bytes static = 2;
		optional bytes payload = 3;
	}

	message ServerHello {
		optional bytes ephemeral = 1;
		optional bytes static = 2;
		optional bytes payload = 3;
	}

	message ClientFinish {
		optional bytes static = 1;
		optional bytes payload = 2;
	}

	optional ClientHello clientHello = 2;
	optional ServerHello serverHello = 3;
	optional ClientFinish clientFinish = 4;
}

message ClientPayload {
	enum ConnectType {
		CELLULAR_UNKNOWN = 0;
		WIFI_UNKNOWN = 1;
	}

	enum ConnectReason {
		PUSH = 0;
		USER_ACTIVATED = 1;
		SCHEDULED = 2;
		ERROR_RECONNECT = 3;
		NETWORK_SWITCH = 4;
		PING_RECONNECT = 5;
		UNKNOWN = 6;
	}

	message WebInfo {
		enum WebSubPlatform {
			WEB_BROWSER = 0;
			APP_STORE = 1;
			WIN_STORE = 2;
			DARWIN = 3;
			WIN32 = 4;
		}

		optional string refToken = 1;
		optional string version = 2;
		optional WebSubPlatform webSubPlatform = 4;
	}

	message UserAgent {
		enum ReleaseChannel {
			RELEASE = 0;
			BETA = 1;
			ALPHA = 2;
			DEBUG = 3;
		}

		enum Platform {
			ANDROID = 0;
			IOS = 1;
			WINDOWS = 13;
			WEB = 14;
			MACOS = 24;
		}

		message AppVersion {
			optional uint32 primary = 1;
			optional uint32 secondary = 2;
			optional uint32 tertiary = 3;
			optional uint32 quaternary = 4;
			optional uint32 quinary = 5;
		}

		optional Platform platform = 1;
		optional AppVersion appVersion = 2;
		optional string mcc = 3;
		optional string mnc = 4;
		optional string osVersion = 5;
		optional string manufacturer = 6;
		optional string device = 7;
		optional string osBuildNumber = 8;
		optional string phoneID = 9;
		optional ReleaseChannel releaseChannel = 10;
		optional string localeLanguageIso6391 = 11;
		optional string localeCountryIso31661Alpha2 = 12;
	}

	// Sent on first connection (no account yet): our public identity material
	// that the phone binds to during QR pairing.
	message DevicePairingRegistrationData {
		optional bytes eRegid = 1;     // registration id, 4 bytes big-endian
		optional bytes eKeytype = 2;   // 0x05 (Curve25519 "DJB" key type)
		optional bytes eIdent = 3;     // identity public key, 32 bytes
		optional bytes eSkeyID = 4;    // signed prekey id, 3 bytes big-endian
		optional bytes eSkeyVal = 5;   // signed prekey public key, 32 bytes
		optional bytes eSkeySig = 6;   // signature of 0x05||eSkeyVal by identity key
		optional bytes buildHash = 7;  // md5("major.minor.patch")
		optional bytes deviceProps = 8; // serialized wacompanionreg.DeviceProps
	}

	optional uint64 username = 1;
	optional bool passive = 3;
	optional UserAgent userAgent = 5;
	optional WebInfo webInfo = 6;
	optional string pushName = 7;
	optional sfixed32 sessionID = 9;
	optional bool shortConnect = 10;
	optional ConnectType connectType = 12;
	optional ConnectReason connectReason = 13;
	repeated int32 shards = 14;
	optional uint32 connectAttemptCount = 16;
	optional uint32 device = 18;
	optional DevicePairingRegistrationData devicePairingData = 19;
	optional bool oc = 23;
	optional int32 lc = 24;
	optional bool pull = 33;
	optional bool lidDbMigrated = 41;
}
